name: UI APK packages

on:
  push:
    tags: ['ui-*']

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-37.1' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Use official repositories for the hosted build
        run: |
          cat > "$RUNNER_TEMP/fitlog-repositories.gradle" <<'EOF'
          settingsEvaluated { settings ->
              settings.pluginManagement.repositories {
                  clear()
                  mavenCentral()
                  google()
                  gradlePluginPortal()
              }
              settings.dependencyResolutionManagement.repositories {
                  clear()
                  mavenCentral()
                  google()
              }
          }
          EOF

      - name: Build Debug and Release APKs and run lint
        run: >-
          bash ./gradlew :app:assembleDebug :app:assembleRelease :app:lint
          --init-script "$RUNNER_TEMP/fitlog-repositories.gradle"
          --no-daemon --no-parallel --max-workers=1
          -Dorg.gradle.jvmargs='-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8'
          -Pkotlin.compiler.execution.strategy=in-process
          --refresh-dependencies --info --console=plain

      - name: Prepare packages
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/FitLog-ui-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/FitLog-ui-release.apk
          cd dist
          sha256sum FitLog-ui-debug.apk FitLog-ui-release.apk > SHA256SUMS.txt
          cat > release-notes.md <<EOF
          Built from the ui branch at commit ${GITHUB_SHA}.

          - Move the Insight title and refresh button into the top app bar.
          - Preserve the selected Insight time range across navigation and app restarts.

          Packages: FitLog-ui-debug.apk and FitLog-ui-release.apk.
          Release uses the project's configured debug signing key, with R8 and resource shrinking enabled.
          Both builds and lint passed. Device testing has not been performed.
          EOF

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/FitLog-ui-debug.apk dist/FitLog-ui-release.apk dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "FitLog UI ${GITHUB_REF_NAME#ui-}" \
            --notes-file dist/release-notes.md --prerelease --latest=false
