name: APK packages

on:
  push:
    tags: ['ui-*', 'agent-*']

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-37.1' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Use official repositories for the hosted build
        run: |
          cat > "$RUNNER_TEMP/fitlog-repositories.gradle" <<'EOF'
          settingsEvaluated { settings ->
              settings.pluginManagement.repositories {
                  clear()
                  mavenCentral()
                  google()
                  gradlePluginPortal()
              }
              settings.dependencyResolutionManagement.repositories {
                  clear()
                  mavenCentral()
                  google()
              }
          }
          EOF

      - name: Run JVM tests, build Debug and Release APKs, and run lint
        run: >-
          bash ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:lintDebug
          --init-script "$RUNNER_TEMP/fitlog-repositories.gradle"
          --no-daemon --no-parallel --max-workers=1
          -Dorg.gradle.jvmargs='-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8'
          -Pkotlin.compiler.execution.strategy=in-process
          --console=plain

      - name: Prepare packages
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/FitLog-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/FitLog-release.apk
          cd dist
          sha256sum FitLog-debug.apk FitLog-release.apk > SHA256SUMS.txt
          python3 - <<'PYMETA'
          import json, os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('../gradle/libs.versions.toml').read_text())['versions']['okhttpBom']
          metadata = {'commit': os.environ['GITHUB_SHA'], 'tag': os.environ['GITHUB_REF_NAME'], 'okhttp': version}
          pathlib.Path('build-info.json').write_text(json.dumps(metadata, indent=2) + '\n')
          pathlib.Path('release-notes.md').write_text(
              f"Built from {metadata['tag']} at commit {metadata['commit']}.\n\n"
              f"OkHttp: {version}.\n\n"
              "Packages: FitLog-debug.apk and FitLog-release.apk.\n"
              "Validation: JVM test task, Debug and Release builds, and lint completed.\n"
              "Release uses the project's configured debug signing key, with R8 and resource shrinking enabled.\n"
              "Device testing has not been performed.\n"
          )
          PYMETA

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ github.ref_name }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/FitLog-debug.apk dist/FitLog-release.apk dist/SHA256SUMS.txt dist/build-info.json \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "FitLog ${GITHUB_REF_NAME}" \
            --notes-file dist/release-notes.md --prerelease --latest=false
