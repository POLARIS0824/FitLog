name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Lint
        run: ./gradlew lintDebug

      # R8/资源收缩门禁：release 已启用 minify+shrinkResources，keep 规则缺口
      # （ADK、kotlinx-serialization 反射等）只有在 release 构建才会暴露，
      # debug 单测/lint 均覆盖不到；不签名只验证构建与混淆通过
      - name: Release build (R8 gate)
        run: ./gradlew :app:assembleRelease
